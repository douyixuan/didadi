<svg xmlns="http://www.w3.org/2000/svg" width="920" height="840" viewBox="0 0 920 840" role="img" aria-labelledby="title desc">
<title id="title">Didadi 手机编辑布局设计</title><desc id="desc">既有移动候选布局设计示意，非实际手机截图。左为编辑，右为更多格式面板。</desc>
<rect width="920" height="840" fill="#f2f2f7"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" fill="#1c1c1e"><text x="40" y="42" font-size="24" font-weight="600">Didadi · 手机编辑</text><text x="40" y="69" font-size="14" fill="#636366">布局设计示意 · 非运行截图 · 真实键盘/滚动/触控仍待验收</text>
<g transform="translate(40,100)"><rect width="390" height="650" rx="22" fill="white" stroke="#d1d1d6"/><text x="20" y="36" font-size="17" fill="#007aff">退出</text><text x="148" y="36" font-size="13" fill="#636366">未保存更改</text><text x="316" y="36" font-size="17" font-weight="600" fill="#007aff">保存</text><path d="M0 56h390 M0 108h390" stroke="#e5e5ea"/><text x="25" y="90" font-size="18" font-weight="600">B</text><text x="87" y="90" font-size="18" font-style="italic">I</text><text x="146" y="90" font-size="18">列表</text><text x="239" y="90" font-size="18">撤销</text><text x="328" y="90" font-size="18">•••</text><text x="20" y="156" font-size="27" font-weight="600">团队笔记</text><text x="20" y="196" font-size="17">把注意力留给内容。</text><text x="20" y="226" font-size="17">常用工具保持一行，复杂格式</text><text x="20" y="256" font-size="17">需要时再打开。</text><rect x="20" y="286" width="350" height="90" rx="8" fill="#f2f2f7"/><text x="32" y="314" font-size="15" font-family="monospace">const note = 'draft';</text><text x="32" y="343" font-size="14" fill="#636366">代码可横向滚动，不挤压正文</text><path d="M20 410h350" stroke="#e5e5ea"/><text x="20" y="443" font-size="14" fill="#636366">编辑时收起导航、讨论及历史。</text><text x="20" y="470" font-size="14" fill="#636366">草稿异常时出现“导出当前草稿”。</text><rect x="0" y="535" width="390" height="115" rx="22" fill="#e5e5ea"/><text x="58" y="580" font-size="15" fill="#636366">系统键盘区域（网页不可修改）</text><text x="85" y="611" font-size="14" fill="#636366">可视高度变化时保留编辑状态</text></g>
<g transform="translate(490,100)"><rect width="390" height="650" rx="22" fill="white" stroke="#d1d1d6"/><text x="20" y="36" font-size="17" fill="#007aff">退出</text><text x="148" y="36" font-size="13" fill="#636366">未保存更改</text><text x="316" y="36" font-size="17" font-weight="600" fill="#007aff">保存</text><path d="M0 56h390 M0 108h390" stroke="#e5e5ea"/><text x="25" y="90" font-size="18" font-weight="600">B</text><text x="87" y="90" font-size="18" font-style="italic">I</text><text x="146" y="90" font-size="18">列表</text><text x="239" y="90" font-size="18">撤销</text><text x="328" y="90" font-size="18">•••</text><rect x="0" y="108" width="390" height="310" rx="12" fill="#fafafa" stroke="#d1d1d6"/><text x="20" y="145" font-size="17" font-weight="600">更多格式</text><text x="324" y="145" font-size="17" fill="#007aff">关闭</text><g font-size="16"><text x="24" y="192">标题</text><text x="210" y="192">引用</text><text x="24" y="238">代码</text><text x="210" y="238">链接</text><text x="24" y="284">任务列表</text><text x="210" y="284">表格</text><text x="24" y="330">移动段落</text><text x="210" y="330">重做</text></g><text x="20" y="386" font-size="13" fill="#636366">命令保留选区；中文输入中禁用格式操作</text><text x="20" y="471" font-size="14" fill="#636366">面板有界滚动，关闭后回到正文。</text><rect x="0" y="535" width="390" height="115" rx="22" fill="#e5e5ea"/><text x="58" y="580" font-size="15" fill="#636366">系统键盘区域（网页不可修改）</text></g>
<text x="40" y="794" font-size="14" fill="#636366">设计目标对应既有036eac8候选；不表示界面已部署或真实iOS验收通过。</text></g></svg>
