name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  git-docs-spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Temporary Git tests with network and process guards
        run: python3 -m scripts.offline_python
  react-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - name: Injected UI and pagination tests with transport guards
        run: node node_modules/vitest/vitest.mjs run --config vitest.offline.config.js
        working-directory: client
